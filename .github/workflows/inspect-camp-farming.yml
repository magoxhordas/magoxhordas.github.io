name: Inspect camp farming subsystem

on:
  push:
    branches:
      - agent/refactor-collision-architecture
    paths:
      - scripts/extract-camp-farming-snippet.mjs
      - scripts/refactor-camp-farming-system.mjs
      - .github/workflows/inspect-camp-farming.yml

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-collision-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refactor, validate, and publish result
        shell: bash
        run: |
          set +e
          LOG=src/camp/_farming-migration-error.txt
          rm -f "$LOG"
          touch "$LOG"

          # Preserve offsets: perform the CampV2 splices before inserting a new script tag,
          # and remove the indentation that belonged to the old CANTEIROS declaration.
          node <<'NODE'
          const fs=require('node:fs');
          const file='scripts/refactor-camp-farming-system.mjs';
          let src=fs.readFileSync(file,'utf8');
          const loadBlock="// Carrega o comportamento depois dos dados puros e antes do CampV2.\nhtml=replaceOnce(html,DATA_TAG,`${DATA_TAG}\\n  ${SYSTEM_TAG}`,'carga do farming-system');\n\n";
          const oldSplice="html=html.slice(0,firstFarm.start)+bridge+html.slice(lastFarm.end);\nhtml=html.slice(0,canteiros.start)+html.slice(canteiros.end);";
          const newSplice="html=html.slice(0,firstFarm.start)+bridge+html.slice(lastFarm.end);\nconst canteirosLineStart=html.lastIndexOf('\\n',canteiros.start)+1;\nassert(/^[ \\t]*$/.test(html.slice(canteirosLineStart,canteiros.start)),'indentacao inesperada antes de CANTEIROS');\nhtml=html.slice(0,canteirosLineStart)+html.slice(canteiros.end);";
          if(!src.includes(loadBlock)) throw new Error('bloco de carga do farming-system nao encontrado');
          if(!src.includes(oldSplice)) throw new Error('bloco de splice do farming-system nao encontrado');
          src=src.replace(loadBlock,'');
          src=src.replace(oldSplice,newSplice+"\n\n// Carrega o comportamento somente depois dos splices baseados nos offsets originais.\nhtml=replaceOnce(html,DATA_TAG,`${DATA_TAG}\\n  ${SYSTEM_TAG}`,'carga do farming-system');");
          fs.writeFileSync(file,src,'utf8');
          NODE

          run_check() {
            echo "\n===== $* =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              echo "\nFAILED with exit code $code" >> "$LOG"
              cat "$LOG"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$LOG"
              git commit -m "chore: record farming refactor failure" || true
              git push origin HEAD:agent/refactor-collision-architecture
              exit 0
            fi
          }

          run_check node scripts/refactor-camp-farming-system.mjs
          run_check node --check src/camp/collision-map.js
          run_check node --check src/camp/layout-data.js
          run_check node --check src/camp/farming-data.js
          run_check node --check src/camp/farming-system.js
          run_check node --check src/camp/interaction-data.js
          run_check node scripts/verify-camp-modules.mjs
          run_check node scripts/verify-inline-scripts.mjs
          run_check node scripts/verify-campaign-boss-camp.mjs
          run_check node scripts/verify-campaign-shop.mjs
          run_check node scripts/verify-deity-blessings.mjs
          run_check git diff --check

          rm -f "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src scripts/verify-camp-modules.mjs scripts/verify-campaign-boss-camp.mjs
          git rm -f src/camp/_farming-system-snippet.txt
          git rm -f scripts/extract-camp-farming-snippet.mjs
          git rm -f scripts/refactor-camp-farming-system.mjs
          git rm -f .github/workflows/refactor-camp-farming-system.yml
          git rm -f .github/workflows/inspect-camp-farming.yml
          git commit -m "refactor: extract camp farming subsystem"
          git push origin HEAD:agent/refactor-collision-architecture
