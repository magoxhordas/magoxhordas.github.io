name: Refactor camp data structure

on:
  push:
    branches:
      - agent/refactor-collision-architecture
    paths:
      - .github/workflows/refactor-camp-data-structure.yml
      - scripts/refactor-camp-data-structure.mjs

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-collision-architecture
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract camp data modules
        run: node scripts/refactor-camp-data-structure.mjs

      - name: Validate inline JavaScript
        run: node scripts/verify-inline-scripts.mjs

      - name: Validate camp collision and reachability
        run: node scripts/verify-campaign-boss-camp.mjs

      - name: Validate campaign shop
        run: node scripts/verify-campaign-shop.mjs

      - name: Validate deity blessings
        run: node scripts/verify-deity-blessings.mjs

      - name: Check diff
        run: git diff --check

      - name: Commit refactor result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src scripts/verify-campaign-boss-camp.mjs
          git rm scripts/refactor-camp-data-structure.mjs
          git rm .github/workflows/refactor-camp-data-structure.yml
          git commit -m "refactor: extract camp layout and collision footprint"
          git push origin HEAD:agent/refactor-collision-architecture
