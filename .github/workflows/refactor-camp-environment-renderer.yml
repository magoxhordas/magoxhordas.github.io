name: Refactor camp environment renderer

on:
  push:
    branches:
      - agent/refactor-collision-architecture
    paths:
      - scripts/refactor-camp-environment-renderer.mjs
      - .github/workflows/refactor-camp-environment-renderer.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-collision-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract, validate and publish environment renderer
        shell: bash
        run: |
          set +e
          LOG=src/camp/_environment-migration-error.txt
          rm -f "$LOG"
          touch "$LOG"

          run_check() {
            echo "\n===== $* =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              echo "\nFAILED with exit code $code" >> "$LOG"
              cat "$LOG"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$LOG"
              git commit -m "chore: record environment refactor failure" || true
              git push origin HEAD:agent/refactor-collision-architecture
              exit 0
            fi
          }

          run_check node scripts/refactor-camp-environment-renderer.mjs
          run_check node --check src/camp/collision-map.js
          run_check node --check src/camp/layout-data.js
          run_check node --check src/camp/farming-data.js
          run_check node --check src/camp/farming-system.js
          run_check node --check src/camp/interaction-data.js
          run_check node --check src/camp/environment-renderer.js
          run_check node scripts/verify-camp-modules.mjs
          run_check node scripts/verify-inline-scripts.mjs
          run_check node scripts/verify-campaign-boss-camp.mjs
          run_check node scripts/verify-campaign-shop.mjs
          run_check node scripts/verify-deity-blessings.mjs
          run_check git diff --check

          rm -f "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/camp/environment-renderer.js scripts/verify-camp-modules.mjs scripts/verify-campaign-boss-camp.mjs
          git rm -f src/camp/_environment-snippet.txt
          git rm -f scripts/extract-camp-environment-snippet.mjs
          git rm -f .github/workflows/inspect-camp-environment.yml
          git rm -f scripts/refactor-camp-environment-renderer.mjs
          git rm -f .github/workflows/refactor-camp-environment-renderer.yml
          git commit -m "refactor: extract camp environment renderer"
          git push origin HEAD:agent/refactor-collision-architecture
