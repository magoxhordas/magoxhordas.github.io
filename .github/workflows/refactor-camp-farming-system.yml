name: Refactor camp farming system

on:
  push:
    branches:
      - agent/refactor-collision-architecture
    paths:
      - scripts/refactor-camp-farming-system.mjs
      - .github/workflows/refactor-camp-farming-system.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-collision-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract farming subsystem
        run: node scripts/refactor-camp-farming-system.mjs

      - name: Validate camp modules
        run: |
          node --check src/camp/collision-map.js
          node --check src/camp/layout-data.js
          node --check src/camp/farming-data.js
          node --check src/camp/farming-system.js
          node --check src/camp/interaction-data.js
          node scripts/verify-camp-modules.mjs

      - name: Validate inline JavaScript
        run: node scripts/verify-inline-scripts.mjs

      - name: Validate camp collision and reachability
        run: node scripts/verify-campaign-boss-camp.mjs

      - name: Validate campaign shop
        run: node scripts/verify-campaign-shop.mjs

      - name: Validate deity blessings
        run: node scripts/verify-deity-blessings.mjs

      - name: Check diff
        run: git diff --check

      - name: Commit farming refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src scripts/verify-camp-modules.mjs scripts/verify-campaign-boss-camp.mjs
          git rm -f src/camp/_farming-system-snippet.txt
          git rm -f scripts/extract-camp-farming-snippet.mjs
          git rm -f .github/workflows/inspect-camp-farming.yml
          git rm -f scripts/refactor-camp-farming-system.mjs
          git rm -f .github/workflows/refactor-camp-farming-system.yml
          git commit -m "refactor: extract camp farming subsystem"
          git push origin HEAD:agent/refactor-collision-architecture
