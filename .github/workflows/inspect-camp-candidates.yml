name: Inspect CampV2 data candidates

on:
  push:
    branches:
      - agent/refactor-collision-architecture
    paths:
      - .github/workflows/inspect-camp-candidates.yml
      - scripts/extract-camp-candidate-snippets.mjs

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-collision-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/extract-camp-candidate-snippets.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/camp/_candidate-snippets.txt
          git rm scripts/extract-camp-candidate-snippets.mjs
          git rm .github/workflows/inspect-camp-candidates.yml
          git commit -m "chore: inspect CampV2 pure data candidates"
          git push origin HEAD:agent/refactor-collision-architecture
